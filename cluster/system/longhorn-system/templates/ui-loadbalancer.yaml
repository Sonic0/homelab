apiVersion: v1
kind: Service
metadata:
  name: longhorn-ui-lan
  namespace: {{ .Release.Namespace }}
  annotations:
    metallb.io/address-pool: {{ .Values.uiLoadBalancer.addressPool | quote }}
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    {{- toYaml .Values.uiLoadBalancer.sourceRanges | nindent 4 }}
  selector:
    app: longhorn-ui
  ports:
    - name: http
      port: 80
      targetPort: http
