apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dns
  target:
    name: pihole-password
  data:
    - secretKey: password
      remoteRef:
        key: secret/pihole
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
