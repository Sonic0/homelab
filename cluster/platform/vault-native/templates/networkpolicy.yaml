apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-native-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: server
  policyTypes:
    - Ingress
  ingress:
    # External Secrets Operator uses the internal ClusterIP Service.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
    # The LAN Service preserves client IPs with externalTrafficPolicy: Local.
    - from:
        {{- range .Values.lan.sourceRanges }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8200
    # Preserve in-namespace peer traffic if the cluster is expanded later.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              app.kubernetes.io/instance: {{ .Release.Name }}
              component: server
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
